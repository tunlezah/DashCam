name: Build

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.1 build-tools;36.0.0"

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Without this, every CI run generates a fresh debug keystore, so each
      # build carries a different signature and sideloading a newer build over
      # an older one FAILS unless the app is uninstalled first (losing its
      # recordings). Caching one dev keystore keeps the signature stable
      # across runs. The debug keystore uses the public well-known Android
      # debug credentials — it is not a secret and grants nothing.
      - name: Restore stable dev-signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dev-debug-keystore-v1

      - name: Generate dev-signing keystore if absent
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=DashCam Dev, C=AU"
            echo "Generated a new dev keystore (cache was empty — installs over builds from before this run will need an uninstall first)."
          else
            echo "Reusing cached dev keystore — updates install over previous CI builds."
          fi

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK (dev-signed unless signing secrets provided)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APKs exist and are signed (installable)
        run: |
          set -e
          ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          test -f app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify app/build/outputs/apk/debug/app-debug.apk
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify "$apk"
          done
        shell: bash

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
